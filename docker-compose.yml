services:
  # Service do Banco de Dados PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Service da Aplicação Spring Boot
  api-service:
    build: .
    container_name: spring-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: biblioteca_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      - postgres-db

volumes:
  pgdata: